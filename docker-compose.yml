version: "3.7"
services:
  opensearch:
    image: opensearchproject/opensearch:2.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - govnet
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.9.0
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=['http://opensearch:9200']
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - govnet

  scrapy:
    build:
      context: .
      dockerfile: dockerfile.scrapy
    environment:
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_INDEX=govsites
      - SEEDS_FILE=/app/seeds.csv
    volumes:
      - ./seeds.csv:/app/seeds.csv:ro
      - ./govsearch:/app/govsearch
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - govnet
    restart: "no"

volumes:
  opensearch-data:

networks:
  govnet:
    driver: bridge
